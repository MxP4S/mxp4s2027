<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/css/mxp4s.css' | relative_url }}">
  </head>
  <body class="{% if page.title == 'Home' %}mxp-page-home{% else %}mxp-page-subpage{% endif %}">
    {% if page.title == "Home" %}
      {{ content }}
    {% else %}
      <main class="mxp-subpage-shell">
        <nav class="mxp-subpage-nav" aria-label="Workshop navigation">
          <a class="mxp-subpage-brand" href="{{ '/' | relative_url }}">MxP4S 2027</a>
          <div class="mxp-subpage-links">
            <a href="{{ '/dates.html' | relative_url }}"{% if page.url == '/dates.html' %} aria-current="page"{% endif %}>Important dates</a>
            <a href="{{ '/topics.html' | relative_url }}"{% if page.url == '/topics.html' %} aria-current="page"{% endif %}>Call for Papers</a>
            <a href="{{ '/format.html' | relative_url }}"{% if page.url == '/format.html' %} aria-current="page"{% endif %}>Format and schedule</a>
            <a href="{{ '/organizers.html' | relative_url }}"{% if page.url == '/organizers.html' %} aria-current="page"{% endif %}>Organizers</a>
          </div>
        </nav>

        <article class="mxp-subpage-card">
          {{ content }}
        </article>
      </main>
    {% endif %}
  </body>
</html>
